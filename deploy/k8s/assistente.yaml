apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistente
  labels: {app: assistente}
spec:
  # 1 replica: le conversazioni sono in memoria. Con un checkpointer su database (es. Postgres)
  # si può scalare orizzontalmente.
  replicas: 1
  selector:
    matchLabels: {app: assistente}
  template:
    metadata:
      labels: {app: assistente}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: assistente
          image: kyros/assistente:locale
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: CMMS_URL, value: http://cmms}
          envFrom:
            - secretRef: {name: llm}
          readinessProbe:
            httpGet: {path: /api/salute, port: 8000}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /api/salute, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: assistente
spec:
  selector: {app: assistente}
  ports: [{port: 80, targetPort: 8000}]
