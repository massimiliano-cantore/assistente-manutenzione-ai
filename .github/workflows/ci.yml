name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, test e valutazione RAG (veloce)
    runs-on: ubuntu-latest
    env:
      EMBEDDER: tfidf
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (modello a copione, nessuna chiave necessaria)
        run: pytest -q
      - name: Valutazione del recupero (TF-IDF)
        run: |
          echo "| Valutazione | Valore | Soglia | Esito |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          python -m valutazioni.valuta_rag

  rag-denso:
    name: Valutazione RAG con il modello di embedding di produzione
    runs-on: ubuntu-latest
    needs: python
    env:
      EMBEDDER: fastembed
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v6
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('config/agente.yaml') }}
      - name: hit@k e MRR (fallisce sotto la soglia di config/agente.yaml)
        run: |
          echo "| Valutazione | Valore | Soglia | Esito |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          python -m valutazioni.valuta_rag
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-rag
          path: valutazioni/report/

  frontend:
    name: Interfaccia TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Build delle immagini e prova di avvio
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build (CMMS + assistente con indice già costruito)
        run: docker compose build
      - name: Avvio dello stack e controlli di salute
        env:
          GROQ_API_KEY: chiave-finta-solo-per-avvio   # il modello non viene chiamato in questa prova
        run: |
          echo "GROQ_API_KEY=$GROQ_API_KEY" > .env
          docker compose up -d qdrant cmms assistente
          for i in $(seq 1 60); do
            curl -sf localhost:8000/api/salute && break
            sleep 3
          done
          curl -sf localhost:8000/api/salute
          curl -sf localhost:8001/health
          curl -sf localhost:8000/metrics | grep -q assistente_richieste_totali
          curl -sf localhost:8000/ | grep -q "<div id=\"root\">"
      - name: Log in caso di errore
        if: failure()
        run: docker compose logs --tail 200
