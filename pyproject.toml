[project]
name = "assistente-manutenzione-ai"
version = "1.0.0"
description = "Agente LangGraph con RAG per l'assistenza tecnica, integrato con un CMMS"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E702", "B008"]
