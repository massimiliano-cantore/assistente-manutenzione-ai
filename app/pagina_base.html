<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><title>Assistente tecnico</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui,Segoe UI,sans-serif;max-width:900px;margin:0 auto;padding:16px;background:#f6f7f9;color:#1d1f23}
h1{font-size:20px}#chat{display:flex;flex-direction:column;gap:12px;margin-bottom:90px}
.m{padding:12px 14px;border-radius:10px;white-space:pre-wrap;line-height:1.45}
.u{background:#dbe8ff;align-self:flex-end;max-width:80%}.a{background:#fff;border:1px solid #e1e4e8}
.p{font-size:12px;color:#666;margin-top:8px}details{margin-top:6px}img{max-width:100%;border:1px solid #ccc;margin-top:8px}
form{position:fixed;bottom:0;left:0;right:0;background:#f6f7f9;padding:12px;display:flex;gap:8px;max-width:900px;margin:0 auto}
textarea{flex:1;font:inherit;padding:10px;border-radius:8px;border:1px solid #bbb;height:48px}
button{padding:0 18px;border:0;border-radius:8px;background:#1f5fbf;color:#fff;font:inherit;cursor:pointer}
button:disabled{background:#999}
</style></head><body>
<h1>Assistente tecnico <a href="/documenti" style="font-size:14px;font-weight:400;margin-left:12px;color:#1f5fbf">Cerca nei documenti</a></h1>
<div id="chat"></div>
<form id="f"><textarea id="t" placeholder="Descrivi il guasto (es. sull'Arca il motore non si ferma a fine corsa)"></textarea>
<button id="b">Invia</button></form>
<script>
let thread = null;
const chat = document.getElementById("chat"), t = document.getElementById("t"), b = document.getElementById("b");
function msg(testo, cls) { const d = document.createElement("div"); d.className = "m " + cls; d.textContent = testo; chat.appendChild(d); d.scrollIntoView(); return d; }
async function invia(url, corpo) {
  b.disabled = true; const attesa = msg("Sto ragionando... (con un modello in locale può volerci qualche minuto)", "a");
  try {
    const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corpo)});
    const j = await r.json(); attesa.remove();
    if (!r.ok) { msg("Errore: " + JSON.stringify(j), "a"); return; }
    thread = j.thread_id; const d = msg(j.testo || "(nessun testo)", "a");
    const immagini = new Set((JSON.stringify(j.passi).match(/\/api\/immagini\/[a-f0-9]{12}\.png/g) || []));
    immagini.forEach(u => { const i = document.createElement("img"); i.src = u; d.appendChild(i); });
    if (j.passi && j.passi.length) {
      const det = document.createElement("details"); det.innerHTML = "<summary class='p'>Strumenti usati (" + j.passi.length + ") in " + j.secondi.toFixed(0) + " s</summary>";
      const pre = document.createElement("pre"); pre.style.whiteSpace = "pre-wrap"; pre.style.fontSize = "12px";
      pre.textContent = JSON.stringify(j.passi, null, 1).slice(0, 20000); det.appendChild(pre); d.appendChild(det);
    }
    if (j.in_attesa_di_conferma) {
      const ok = confirm("L'assistente chiede conferma:\n" + JSON.stringify(j.in_attesa_di_conferma, null, 1));
      await invia("/api/conferma", {thread_id: thread, approvato: ok});
    }
  } catch (e) { attesa.remove(); msg("Errore di collegamento: " + e, "a"); }
  finally { b.disabled = false; }
}
document.getElementById("f").onsubmit = e => { e.preventDefault(); const q = t.value.trim(); if (!q) return; msg(q, "u"); t.value = ""; invia("/api/chat", {messaggio: q, thread_id: thread}); };
t.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } });
</script></body></html>
